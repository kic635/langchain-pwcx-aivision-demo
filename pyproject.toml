[project]
name = "langchain-pwcx-aivision-demo"
version = "0.1.0"
description = "Cross-conversation context with LangChain, PowerContext and AI Vision"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langchain-core>=1.6.6,<2",
  "langchain-openai>=1.6.7,<2",
  "langfuse>=5.0.2,<6",
  "python-dotenv>=1.2.4,<2",
  "powercontext[client,cli,server] @ git+https://github.com/oceanbase/powercontext.git@f27c0c287e20bcc0be293e8ee9db93331f18f0d9",
  "langchain>=1.4.3,<2",
  "powercontext-langchain @ git+https://github.com/oceanbase/powercontext.git@f27c0c287e20bcc0be293e8ee9db93331f18f0d9#subdirectory=integrations/langchain",
]
[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.ruff]
line-length = 120
target-version = "py311"
